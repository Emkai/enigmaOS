# Do not autoload the Intel IPU6 camera driver from its PCI alias. On laptops
# whose MIPI camera sits behind an MEI-based Intel Visual Sensing Controller
# (IVSC, ACPI INTC10CF on Meteor Lake) the driver must probe only after the
# IVSC's MEI CSI client device exists; /etc/udev/rules.d/90-ipu6-after-ivsc.rules
# loads it at that moment. See stages/15-camera-ivsc.sh for the why.
blacklist intel_ipu6
