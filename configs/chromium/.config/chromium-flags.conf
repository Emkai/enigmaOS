# Read by Arch's chromium launcher (/usr/bin/chromium) on every start.
# One flag per line. If another --enable-features line is ever added, merge the
# feature names into this one list: Chromium only honours the last occurrence.
#
# WebRtcPipeWireCamera: use the PipeWire camera portal instead of raw V4L2, so
# Chromium sees the libcamera "Built-in Front Camera" (the IPU6 MIPI webcam has
# no usable V4L2 node). Permission is granted through xdg-desktop-portal, whose
# GTK backend provides the dialog.
--enable-features=WebRtcPipeWireCamera
