<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- fontconfig >= 2.18 ranks the font's genericfamily class above weak prefer lists; CaskaydiaMono is classed mono so it could never win sans-serif/serif -->
  <match target="pattern">
    <edit name="genericfamily" mode="delete_all"/>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>CaskaydiaMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>CaskaydiaMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>CaskaydiaMono Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
