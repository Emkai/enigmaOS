# libcamera's software ISP (used for IPU6 MIPI webcams) debayers on the GPU via
# EGL by default. On this laptop EGL resolves to the NVIDIA driver and every
# frame fails ("glFrameBufferTexture2D error 36054", "debayerGPU failed"),
# yielding black frames and, on stream stop, an assertion that aborts the
# whole WirePlumber process (libcamera 0.7.2, 2026-09-07). CPU debayering is
# reliable and cheap enough at 1928x1092. Newer libcamera also reads
# ~/.config/libcamera/configuration.yaml (configs/libcamera); the environment
# variable takes precedence and is what 0.7.2 understands.
[Service]
Environment=LIBCAMERA_SOFTISP_MODE=cpu
