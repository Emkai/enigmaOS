# Hide the Intel IPU6's raw V4L2 capture nodes. They are the ISP's Bayer input
# queues, ~48 of them, and produce nothing an application can display; the
# usable camera is the libcamera node ("Built-in Front Camera") that
# WirePlumber's libcamera monitor creates for the same sensor. Without this,
# apps list dozens of dead "ipu6" cameras ahead of the real one.
#
# Node level on purpose. WirePlumber's v4l2 create-device hook (0.5.16, and
# still upstream master as of 2026-09-07) returns without completing its async
# transition when device.disabled is set, which stalls the event dispatcher and
# silently prevents every later camera device, the libcamera one included, from
# being created. The create-node hook completes its transition correctly.
# api.v4l2.cap.driver is only populated once the device is open, so it is a
# node-level property anyway.
monitor.v4l2.rules = [
  {
    matches = [
      {
        api.v4l2.cap.driver = "isys"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
